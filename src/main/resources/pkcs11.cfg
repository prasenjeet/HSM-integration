# PKCS#11 configuration for SoftHSM2
# Used by the Sun PKCS11 security provider (built into JDK 9+)
#
# To find the correct library path on your system:
#   Linux (apt):    /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
#   Linux (rpm):    /usr/lib64/softhsm/libsofthsm2.so
#   macOS (brew):   /usr/local/lib/softhsm/libsofthsm2.so  (Intel)
#                   /opt/homebrew/lib/softhsm/libsofthsm2.so  (Apple Silicon)
#
# Override at runtime:  -Dhsm.lib.path=/path/to/libsofthsm2.so

name = SoftHSM2

# Path to the SoftHSM2 shared library - override via system property hsm.lib.path
library = /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so

# Slot index (0 = first initialized slot).
# Change to slotListIndex = <N> when multiple tokens are present.
slotListIndex = 0

# Enable CKF_LOGIN_REQUIRED and CKF_TOKEN_INITIALIZED checks
attributes(generate, CKO_PRIVATE_KEY, CKK_RSA) = {
  CKA_TOKEN = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
}

attributes(generate, CKO_PRIVATE_KEY, CKK_EC) = {
  CKA_TOKEN = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
}

attributes(generate, CKO_SECRET_KEY, CKK_AES) = {
  CKA_TOKEN = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
}
